<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="svg_recorder">
<title>%TITLE%</title>
<style>
/* The inlined recording brings a document-wide stylesheet (text, .b, .i, .u,
   .e, .fN, .gN, .tN), so everything here is addressed by id, never by class. */
:root{
  --term:#202124;--page:#141517;--chrome:#2b2c30;
  --ink:#e8eaed;--muted:rgba(232,234,237,.56);--line:rgba(255,255,255,.14);
  --accent:#7ab8ff;--shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-tone=light]{
  --page:#e9eaec;--chrome:#f1f2f4;
  --ink:#1f2328;--muted:rgba(31,35,40,.62);--line:rgba(0,0,0,.14);
  --accent:#0969da;--shadow:rgba(0,0,0,.22);
  color-scheme:light;
}
@supports (color:color-mix(in srgb,red,blue)){
  :root{--page:color-mix(in srgb,var(--term) 62%,#000);--chrome:color-mix(in srgb,var(--term) 91%,#fff)}
  :root[data-tone=light]{--page:color-mix(in srgb,var(--term) 91%,#000);--chrome:color-mix(in srgb,var(--term) 95%,#000)}
  /* a near-black terminal cannot sit on a darker page, so lift the page instead */
  :root[data-tone=black]{--page:color-mix(in srgb,var(--term) 90%,#fff)}
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;padding:clamp(12px,4vw,48px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--page);color:var(--ink);
  font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
#win{
  width:100%;margin:0;overflow:hidden;
  background:var(--term);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 1px 2px var(--shadow),0 18px 48px -12px var(--shadow);
}
#chrome{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  height:34px;padding:0 12px;background:var(--chrome);border-bottom:1px solid var(--line);
}
#dots{display:flex;gap:7px}
#dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
#name{
  color:var(--muted);font-size:12px;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#rec svg{display:block;width:100%;height:auto}
#bar{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;background:var(--chrome);border-top:1px solid var(--line);
}
#bar button{
  flex:none;display:grid;place-items:center;width:30px;height:30px;padding:0;
  color:var(--ink);background:none;border:0;border-radius:7px;cursor:pointer;
}
#bar button svg{width:16px;height:16px;fill:currentColor}
#bar button:hover,#speed:hover{background:var(--line)}
#bar :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#bar[data-state=playing] #ico-play,#bar[data-state=paused] #ico-pause{display:none}
#bar[data-empty]{opacity:.45;pointer-events:none}
#pos{
  -webkit-appearance:none;appearance:none;flex:1 1 120px;min-width:60px;height:30px;
  margin:0 6px;background:none;cursor:pointer;--p:0%;
}
#pos::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p));
}
#pos::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;margin-top:-4px;
  border-radius:50%;background:var(--ink);box-shadow:0 0 0 1px var(--shadow);
}
#pos::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
#pos::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
#pos::-moz-range-thumb{
  width:12px;height:12px;border:0;border-radius:50%;
  background:var(--ink);box-shadow:0 0 0 1px var(--shadow);
}
#time{
  flex:none;color:var(--muted);white-space:nowrap;
  font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;
}
#speed{
  flex:none;-webkit-appearance:none;appearance:none;height:30px;padding:0 8px;margin-left:2px;
  color:var(--ink);background:none;border:0;border-radius:7px;cursor:pointer;
  font:inherit;font-variant-numeric:tabular-nums;text-align:center;
}
#keys{margin:0;color:var(--muted);font-size:12px;text-align:center}
#keys kbd{
  display:inline-block;min-width:1.6em;padding:0 5px;margin:0 1px;
  border:1px solid var(--line);border-radius:4px;font:inherit;text-align:center;
}
#keys span{margin:0 8px;white-space:nowrap}
@media (max-width:520px){#keys{display:none}#time{font-size:11px}}
</style>
</head>
<body>
<figure id="win">
<div id="chrome"><span id="dots"><i></i><i></i><i></i></span><span id="name">%TITLE%</span><span></span></div>
<div id="rec">
<!-- The SVG content goes here -->
</div>
<div id="bar" data-state="playing">
<button id="toggle" type="button" title="Play / pause (space)" aria-label="Pause">
<svg id="ico-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.3v11.4a.6.6 0 0 0 .9.5l9-5.7a.6.6 0 0 0 0-1l-9-5.7a.6.6 0 0 0-.9.5z"/></svg>
<svg id="ico-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h2.6a.5.5 0 0 1 .5.5v10a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5zm5.4 0H12a.5.5 0 0 1 .5.5v10a.5.5 0 0 1-.5.5H9.4a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5z"/></svg>
</button>
<button id="restart" type="button" title="Restart (r)" aria-label="Restart">
<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2V.9a.3.3 0 0 0-.5-.2L4.2 3.7a.3.3 0 0 0 0 .5l3.3 3a.3.3 0 0 0 .5-.2V4.7a4.05 4.05 0 1 1-4.05 4.05.75.75 0 0 0-1.5 0A5.55 5.55 0 1 0 8 3.2z"/></svg>
</button>
<input id="pos" type="range" min="0" max="0" step="1" value="0" aria-label="Position">
<span id="time">0:00.0 / 0:00.0</span>
<select id="speed" title="Playback speed" aria-label="Playback speed">
<option value="0.25">0.25&times;</option><option value="0.5">0.5&times;</option>
<option value="1" selected>1&times;</option><option value="2">2&times;</option><option value="4">4&times;</option>
</select>
</div>
</figure>
<p id="keys"><span><kbd>space</kbd> play / pause</span><span><kbd>&larr;</kbd><kbd>&rarr;</kbd> seek 1 s</span><span><kbd>,</kbd><kbd>.</kbd> step</span><span><kbd>r</kbd> restart</span></p>
<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const rec = $("rec"), bar = $("bar"), pos = $("pos"), time = $("time"), toggle = $("toggle");
  const svg = rec.querySelector("svg");

  /* Take the page's colours and the window's width from the recording. */
  if (svg) {
    const w = svg.width.baseVal.value;
    if (w) $("win").style.maxWidth = (w + 2) + "px";
    const back = svg.querySelector("rect");
    if (back) {
      const rgb = (getComputedStyle(back).fill.match(/[\d.]+/g) || []).map(Number);
      if (rgb.length >= 3) {
        const root = document.documentElement;
        root.style.setProperty("--term", "rgb(" + rgb.slice(0, 3).join(",") + ")");
        const luma = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
        if (luma > 140) root.dataset.tone = "light";
        else if (luma < 20) root.dataset.tone = "black";
      }
    }
  }

  /* A looping recording gives every frame one endless animation of the same
     length.  A play-once recording gives every frame a 1 ms animation with its
     own delay, so each one ends at a different time, and the page keeps time
     by the one that ends last. */
  const list = rec.getAnimations({subtree: true});
  const timing = list.map(a => a.effect.getComputedTiming());
  const looping = timing.some(t => t.iterations === Infinity);
  const ends = timing.map(t => t.iterations === Infinity ? Infinity : t.endTime);
  let span = 0, clock = null;
  timing.forEach((t, i) => {
    const len = looping ? Number(t.duration) : t.endTime;
    if (len > span) { span = len; clock = list[i]; }
  });
  if (!span) {
    bar.dataset.empty = "";
    bar.dataset.state = "paused";
    $("keys").hidden = true;
    for (const el of bar.querySelectorAll("button,input,select")) el.disabled = true;
    return;
  }
  const last = looping ? span - 1 : span;  /* latest time that can be shown */
  pos.max = String(Math.round(last));

  let playing = true, scrub = null;
  const now = () => {
    const t = Number(clock.currentTime) || 0;
    return looping ? ((t % span) + span) % span : Math.min(Math.max(t, 0), span);
  };
  /* play() rewinds an animation that has already ended, which would hide
     frames that must stay on screen; only start the ones still to come. */
  const resume = t => list.forEach((a, i) => { if (ends[i] > t) a.play(); });
  const seek = ms => {
    const t = Math.min(Math.max(ms, 0), last);
    for (const a of list) a.currentTime = t;
    if (playing) resume(t);
    paint();
  };
  const state = on => {
    playing = on;
    bar.dataset.state = on ? "playing" : "paused";
    toggle.setAttribute("aria-label", on ? "Pause" : "Play");
  };
  const play = () => {
    let t = now();
    if (!looping && t >= span) { for (const a of list) a.currentTime = 0; t = 0; }
    state(true);
    resume(t);
  };
  const pause = () => { state(false); for (const a of list) a.pause(); paint(); };

  const fmt = ms => {
    const tenths = Math.round(Math.max(ms, 0) / 100), m = Math.floor(tenths / 600);
    return m + ":" + ((tenths % 600) / 10).toFixed(1).padStart(4, "0");
  };
  function paint() {
    const t = now();
    if (scrub === null) pos.value = String(Math.round(t));
    pos.style.setProperty("--p", (100 * Math.min(t / last, 1)).toFixed(2) + "%");
    time.textContent = fmt(t) + " / " + fmt(span);
    /* Pause at the end, not just show it: a finished animation that is not
       paused would start running again as soon as a seek moved it back. */
    if (playing && !looping && t >= span) pause();
  }

  toggle.onclick = () => (playing ? pause() : play());
  $("restart").onclick = () => { seek(0); play(); };
  $("speed").onchange = e => {
    const rate = Number(e.target.value);
    for (const a of list) a.updatePlaybackRate(rate);
    e.target.blur();  /* hand the keyboard back to the page's shortcuts */
  };
  pos.oninput = () => {
    if (scrub === null) { scrub = playing; pause(); }
    seek(Number(pos.value));
  };
  pos.onchange = () => {
    const go = scrub;
    scrub = null;
    /* dropped on the very end of a play-once recording: stay there */
    if (go && (looping || now() < span)) play();
  };

  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = e.target.tagName;
    if (tag === "SELECT") return;
    const steps = {ArrowLeft: -1000, ArrowRight: 1000, ",": -50, ".": 50};
    if (e.key === " ") {
      if (tag === "BUTTON" || e.repeat) return;  /* a button handles its own space */
      toggle.click();
    } else if (e.key === "r" || e.key === "R") {
      $("restart").click();
    } else if (e.key in steps) {
      if (Math.abs(steps[e.key]) < 1000 && playing) pause();
      seek(now() + steps[e.key]);
    } else {
      return;
    }
    e.preventDefault();
  });

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { pause(); seek(0); }
  (function tick() { paint(); requestAnimationFrame(tick); })();
})();
</script>
</body>
</html>
